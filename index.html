  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .font-note { font-family: 'Andika', sans-serif; font-size: 38px; letter-spacing: 0.05em; }
    .slide-bg { background: linear-gradient(135deg, #004d40 0%, #00251a 100%); }
    
    .four-lines-bg {
      background-image: 
        linear-gradient(transparent 34px, #4b5563 34px, #4b5563 36px, transparent 36px),
        linear-gradient(transparent 45px, #4b5563 45px, #4b5563 47px, transparent 47px),
        linear-gradient(transparent 62px, #dc2626 62px, #dc2626 64px, transparent 64px),

      background-size: 100% 90px;
      line-height: 90px;
      padding-top: 3px; 
      min-height: 90px;
    }

    .custom-scrollbar::-webkit-scrollbar { height: 12px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .shake-animation { animation: shake 0.5s; }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    const GAS_URLS = [

    ];

    const INITIAL_INPUTS = [
      { type: 'topic', label: '一番の思い出', prefix: 'My best memory is ', suffix: '.', action: '', example: '運動会' },
      { type: 'action', label: 'したこと・楽しんだこと①', prefix: 'I ', suffix: '.', action: '', example: 'たくさん走った' },
      { type: 'action', label: 'したこと・楽しんだこと②', prefix: 'I ', suffix: '.', action: '', example: '友達とお弁当を食べた' },
      { type: 'feeling', label: '感想', prefix: 'It was ', suffix: '.', action: '', example: 'とても楽しかった' }
    ];

    const CoinGame = ({ playerEmoji, helpers, onFinish }) => {
      const canvasRef = useRef(null);
      const [timeLeft, setTimeLeft] = useState(15);
      const requestRef = useRef();
      
      const stateRef = useRef({
        player: { x: 150, y: 150, size: 40, speed: 5, frozenFrames: 0 },
        coins: [],
        monsters: [],
        helperBots: helpers.map(h => ({
          x: Math.random() * 260 + 20, y: Math.random() * 360 + 20,
          size: 40, emoji: h.emoji,
          dx: (Math.random() - 0.5) * 6, dy: (Math.random() - 0.5) * 6
        })),
        keys: {},
        score: 0,
        width: 300,
        height: 400,
        isPlaying: true
      });

      useEffect(() => {
        const w = window.innerWidth > 500 ? 500 : window.innerWidth - 40;
        stateRef.current.width = w;
        
        for(let i=0; i<6; i++) spawnCoin();
        for(let i=0; i<3; i++) spawnMonster();
        
        const handleKeyDown = (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { stateRef.current.keys[e.key] = true; e.preventDefault(); }};
        const handleKeyUp = (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { stateRef.current.keys[e.key] = false; e.preventDefault(); }};
        window.addEventListener('keydown', handleKeyDown, {passive: false});
        window.addEventListener('keyup', handleKeyUp);
        
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if(prev <= 1) {
              clearInterval(timer);
              stateRef.current.isPlaying = false;
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        const loop = () => {
          if(!stateRef.current.isPlaying) return;
          update();
          draw();
          requestRef.current = requestAnimationFrame(loop);
        };
        requestRef.current = requestAnimationFrame(loop);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
          clearInterval(timer);
          cancelAnimationFrame(requestRef.current);
        };
      }, []);

      useEffect(() => {
        if(timeLeft === 0) onFinish(stateRef.current.score);
      }, [timeLeft, onFinish]);

      const spawnCoin = () => {
        const { width, height } = stateRef.current;
        stateRef.current.coins.push({ x: Math.random() * (width - 40) + 20, y: Math.random() * (height - 40) + 20, size: 20 });
      };

      const spawnMonster = () => {
        const { width, height } = stateRef.current;
        stateRef.current.monsters.push({
          x: Math.random() * (width - 60) + 30, y: Math.random() * (height - 60) + 30,
          size: 40, dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 4
        });
      };

      const update = () => {
        const state = stateRef.current;
        const { player, coins, monsters, helperBots, keys, width, height } = state;

        helperBots.forEach(h => {
          h.x += h.dx;
          h.y += h.dy;
          if (h.x < h.size/2 || h.x > width - h.size/2) h.dx *= -1;
          if (h.y < h.size/2 || h.y > height - h.size/2) h.dy *= -1;

          for (let i = monsters.length - 1; i >= 0; i--) {
            const m = monsters[i];
            if (Math.hypot(h.x - m.x, h.y - m.y) < (h.size + m.size) / 2) {
              monsters.splice(i, 1);
              spawnMonster();
            }
          }
        });

        if (player.frozenFrames > 0) {
          player.frozenFrames--;
        } else {
          let dx = 0, dy = 0;
          if (keys['ArrowUp']) dy -= player.speed;
          if (keys['ArrowDown']) dy += player.speed;
          if (keys['ArrowLeft']) dx -= player.speed;
          if (keys['ArrowRight']) dx += player.speed;
          
          player.x += dx;
          player.y += dy;
          player.x = Math.max(player.size/2, Math.min(width - player.size/2, player.x));
          player.y = Math.max(player.size/2, Math.min(height - player.size/2, player.y));
        }

        monsters.forEach(m => {
          m.x += m.dx;
          m.y += m.dy;
          if (m.x < m.size/2 || m.x > width - m.size/2) m.dx *= -1;
          if (m.y < m.size/2 || m.y > height - m.size/2) m.dy *= -1;

          if (player.frozenFrames === 0) {
            const dist = Math.hypot(player.x - m.x, player.y - m.y);
            if (dist < (player.size + m.size) / 2 - 5) {
              player.frozenFrames = 60;
              const canvas = canvasRef.current;
              if(canvas) {
                canvas.classList.add('shake-animation');
                setTimeout(() => canvas.classList.remove('shake-animation'), 500);
              }
            }
          }
        });

        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          if (Math.hypot(player.x - c.x, player.y - c.y) < (player.size + c.size) / 2) {
            coins.splice(i, 1);
            state.score++;
            spawnCoin();
          }
        }
      };

      const draw = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const state = stateRef.current;

        ctx.clearRect(0, 0, state.width, state.height);
        
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for(let i=0; i<state.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, state.height); ctx.stroke(); }
        for(let i=0; i<state.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(state.width, i); ctx.stroke(); }

        state.coins.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.size/2, 0, Math.PI * 2);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#d97706';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('¥', c.x, c.y);
        });

        state.helperBots.forEach(h => {
          ctx.font = `${h.size}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(h.emoji, h.x, h.y);
        });

        state.monsters.forEach(m => {
          ctx.font = `${m.size}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('👾', m.x, m.y);
        });

        const p = state.player;
        ctx.globalAlpha = p.frozenFrames > 0 && Math.floor(p.frozenFrames / 10) % 2 === 0 ? 0.5 : 1.0; 
        ctx.font = `${p.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(playerEmoji, p.x, p.y);
        ctx.globalAlpha = 1.0;
        
        if(p.frozenFrames > 0) {
          ctx.fillStyle = 'red';
          ctx.font = '24px Arial bold';
          ctx.fillText('💥', p.x, p.y - p.size);
        }
      };

      const handleBtn = (key, isDown) => { stateRef.current.keys[key] = isDown; };

      return (
        <div className="flex flex-col items-center bg-gray-900 p-4 rounded-3xl border-4 border-gray-700 shadow-2xl touch-none">
          <div className="flex justify-between w-full mb-4 px-2">
            <div className="text-xl font-bold text-white bg-gray-800 px-4 py-1 rounded-full border-2 border-gray-600">⏳ {timeLeft}</div>
            <div className="text-xl font-bold text-yellow-400 bg-gray-800 px-4 py-1 rounded-full border-2 border-gray-600">🪙 {stateRef.current.score}</div>
          </div>
          <div className="bg-gray-800 rounded-xl overflow-hidden shadow-inner">
            <canvas ref={canvasRef} width={stateRef.current.width} height={stateRef.current.height} />
          </div>
          
          <div className="grid grid-cols-3 gap-2 mt-4 w-full max-w-[250px]">
            <div />
            <button onPointerDown={() => handleBtn('ArrowUp', true)} onPointerUp={() => handleBtn('ArrowUp', false)} onPointerLeave={() => handleBtn('ArrowUp', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-teal-600 flex items-center justify-center">⬆️</button>
            <div />
            <button onPointerDown={() => handleBtn('ArrowLeft', true)} onPointerUp={() => handleBtn('ArrowLeft', false)} onPointerLeave={() => handleBtn('ArrowLeft', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-teal-600 flex items-center justify-center">⬅️</button>
            <button onPointerDown={() => handleBtn('ArrowDown', true)} onPointerUp={() => handleBtn('ArrowDown', false)} onPointerLeave={() => handleBtn('ArrowDown', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-teal-600 flex items-center justify-center">⬇️</button>
            <button onPointerDown={() => handleBtn('ArrowRight', true)} onPointerUp={() => handleBtn('ArrowRight', false)} onPointerLeave={() => handleBtn('ArrowRight', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-teal-600 flex items-center justify-center">➡️</button>
          </div>
          <p className="text-gray-400 mt-4 text-sm text-center font-bold">やじるしキー（または ボタン）で うごかして コインを あつめよう！<br/>なかま が エイリアンを やっつけてくれるよ！</p>
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [stepHistory, setStepHistory] = useState(['HOME']);
      const [totalCoins, setTotalCoins] = useState(0);
      const [items, setItems] = useState({ salmon: 0 });
      const [kummaniLevel, setKummaniLevel] = useState(1);
      const [kummaniExp, setKummaniExp] = useState(0);
      const [helpers, setHelpers] = useState([]);
      const [cookedDishes, setCookedDishes] = useState([]);
      
      const [inputs, setInputs] = useState(JSON.parse(JSON.stringify(INITIAL_INPUTS)));
      const [answers, setAnswers] = useState(null);
      const [translatingState, setTranslatingState] = useState({});
      const [fallbackMode, setFallbackMode] = useState({});
      const [manualInputs, setManualInputs] = useState({});
      
      const [savedWorks, setSavedWorks] = useState([]);
      const [viewingWork, setViewingWork] = useState(null);
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

      const [currentSpeakLine, setCurrentSpeakLine] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      const [failCount, setFailCount] = useState(0);
      
      const [feedEffect, setFeedEffect] = useState(null);
      const [showNoteConfirm, setShowNoteConfirm] = useState(false);

      const [slideVoiceCleared, setSlideVoiceCleared] = useState(false);
      const [slideVoiceFailCount, setSlideVoiceFailCount] = useState(0);
      const [isSlideListening, setIsSlideListening] = useState(false);
      const [slideVoiceFeedback, setSlideVoiceFeedback] = useState("");

      const resetSlideVoice = () => {
        setSlideVoiceCleared(false);
        setSlideVoiceFailCount(0);
        setSlideVoiceFeedback("");
        setIsSlideListening(false);
      };

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const load = (key, setter, isObj = false) => {
          const val = localStorage.getItem(key);
          if (val) setter(isObj ? JSON.parse(val) : parseInt(val, 10));
        };
        load('myBestMemoryCoins_V3', setTotalCoins);
        load('myBestMemoryItems_V3', setItems, true);
        load('myBestMemoryKummaniLevel_V3', setKummaniLevel);
        load('myBestMemoryKummaniExp_V3', setKummaniExp);
        load('myBestMemoryHelpers_V3', setHelpers, true);
        load('myBestMemoryWorks_V3', setSavedWorks, true);
        
        const storedDishesStr = localStorage.getItem('myBestMemoryDishes_V3');
        if (storedDishesStr) {
          const arr = JSON.parse(storedDishesStr);
          setCookedDishes(arr.map(d => typeof d === 'string' ? d : d.name));
        }
      }, []);

      const saveProgress = (newCoins, newItems, newLevel, newExp, newHelpers = helpers, newDishes = cookedDishes) => {
        localStorage.setItem('myBestMemoryCoins_V3', newCoins.toString());
        localStorage.setItem('myBestMemoryItems_V3', JSON.stringify(newItems));
        localStorage.setItem('myBestMemoryKummaniLevel_V3', newLevel.toString());
        localStorage.setItem('myBestMemoryKummaniExp_V3', newExp.toString());
        localStorage.setItem('myBestMemoryHelpers_V3', JSON.stringify(newHelpers));
        localStorage.setItem('myBestMemoryDishes_V3', JSON.stringify(newDishes));
        
        setTotalCoins(newCoins); setItems(newItems); setKummaniLevel(newLevel); 
        setKummaniExp(newExp); setHelpers(newHelpers); setCookedDishes(newDishes);
      };

      const saveWork = (workData) => {
        const newWorks = [workData, ...savedWorks];
        localStorage.setItem('myBestMemoryWorks_V3', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
      };

      const speak = useCallback((text) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = 0.9;
        synth.speak(utterThis);
      }, [synth]);

      const goToStep = (newStep) => {
        setStepHistory(prev => [...prev, newStep]);
        setStep(newStep);
        window.scrollTo(0, 0);
      };

      const goBack = () => {
        if (stepHistory.length > 1) {
          const newHistory = [...stepHistory];
          newHistory.pop();
          setStep(newHistory[newHistory.length - 1]);
          setStepHistory(newHistory);
        } else {
          setStep('HOME');
          setStepHistory(['HOME']);
        }
      };

      const cleanTrans = (text) => {
        if (!text) return "";
        let s = text.trim();
        s = s.replace(/[\.\,\!]+$/, "").trim().toLowerCase();
        
        if (s.startsWith("i ")) s = s.substring(2).trim();
        if (s.startsWith("my best memory is ")) s = s.substring(18).trim();
        if (s.startsWith("it was ")) s = s.substring(7).trim();
        
        return s;
      };

      const getSentence = (ans) => {
        if (!ans) return "";
        return `${ans.prefix}${ans.en}${ans.suffix}`;
      };

      const translateWithGAS = async (text) => {
        const urls = [...GAS_URLS].sort(() => 0.5 - Math.random());
        for (const url of urls) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);
            const res = await fetch(`${url}?text=${encodeURIComponent(text)}`, { signal: controller.signal });
            clearTimeout(timeoutId);
            const data = await res.json();
            if (data && data.text) return data.text;
          } catch (e) {
            console.warn("GAS translation failed, trying next...");
          }
        }
        throw new Error("All GAS URLs failed");
      };

      const handleTranslateSingle = async (idx) => {
        const inp = inputs[idx];

        if (!inp.action.trim()) {
          alert(`テキストを にゅうりょく してね！`);
          return;
        }

        setTranslatingState(prev => ({ ...prev, [idx]: true }));
        setFallbackMode(prev => ({ ...prev, [idx]: false }));
        
        const jpAction = inp.action.trim();

        let isDone = false;
        const fallbackTimer = setTimeout(() => {
          if (!isDone) {
            setFallbackMode(prev => ({ ...prev, [idx]: true }));
          }
        }, 4000);

        try {
          let rawEn = "";
          if (inp.type === 'topic' && MEMORY_DIC[jpAction]) {
             rawEn = MEMORY_DIC[jpAction];
             await new Promise(r => setTimeout(r, 800));
          } else {
             rawEn = await translateWithGAS(jpAction);
          }
          
          isDone = true;
          clearTimeout(fallbackTimer);
          
          const newAnswers = answers ? [...answers] : Array(inputs.length).fill(null);
          const cleanedEn = cleanTrans(rawEn);
          
          newAnswers[idx] = { 
            ...inp, 
            en: cleanedEn, 
            rawEn: rawEn, 
            img: "" 
          };
          
          setAnswers(newAnswers);
          setTranslatingState(prev => ({ ...prev, [idx]: false }));
          setFallbackMode(prev => ({ ...prev, [idx]: false }));
        } catch (err) {
          isDone = true;
          clearTimeout(fallbackTimer);
          setFallbackMode(prev => ({ ...prev, [idx]: true }));
          setTranslatingState(prev => ({ ...prev, [idx]: false }));
        }
      };

      const handleManualTranslateComplete = (idx) => {
        if (!manualInputs[idx]) return;
        const newAnswers = answers ? [...answers] : Array(inputs.length).fill(null);
        newAnswers[idx] = { 
            ...inputs[idx], 
            en: cleanTrans(manualInputs[idx]), 
            rawEn: manualInputs[idx],
            img: "" 
        };
        setAnswers(newAnswers);
        setFallbackMode(prev => ({ ...prev, [idx]: false }));
      };

      const startListening = (targetSentence) => {
        if (!SpeechRecognition) {
            alert("マイクが使えません。スキップして進んでください。");
            setFailCount(3);
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const trans = event.results[0][0].transcript.toLowerCase();
          const cleanTransStr = trans.replace(/[^a-z]/g, '');
          const cleanTargetStr = targetSentence.toLowerCase().replace(/[^a-z]/g, '');
          
          let matchCount = 0;
          const minLen = Math.min(cleanTransStr.length, cleanTargetStr.length);
          const maxLen = Math.max(cleanTransStr.length, cleanTargetStr.length);
          
          for(let i=0; i<minLen; i++){
            if(cleanTransStr[i] === cleanTargetStr[i]) matchCount++;
          }
          const matchRate = maxLen > 0 ? (matchCount / maxLen) : 0;
          
          if (matchRate >= 0.8 || trans === targetSentence.toLowerCase().replace(/[.]/g, '')) {
            setFeedbackMsg("Excellent! 👏");
            setFailCount(0);
            setTimeout(() => {
              setFeedbackMsg("");
              setCurrentSpeakLine(c => c + 1);
            }, 1500);
          } else {
            setFailCount(c => c + 1);
            setFeedbackMsg("おしい！もう一度！\n(" + trans + " と聞こえました)");
          }
        };
        recognition.onerror = () => { 
            setFailCount(c => c + 1);
            setFeedbackMsg("エラーがおきました。もう一度ボタンをおしてね。"); 
            setIsListening(false); 
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const startSlideVoiceListening = (targetSentence) => {
        if (!SpeechRecognition) {
            alert("マイクが使えません。スキップして進んでください。");
            setSlideVoiceCleared(true);
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        setIsSlideListening(true);
        setSlideVoiceFeedback("");

        recognition.onresult = (event) => {
          const trans = event.results[0][0].transcript.toLowerCase();
          const cleanTransStr = trans.replace(/[^a-z]/g, '');
          const cleanTargetStr = targetSentence.toLowerCase().replace(/[^a-z]/g, '');
          
          let matchCount = 0;
          const minLen = Math.min(cleanTransStr.length, cleanTargetStr.length);
          const maxLen = Math.max(cleanTransStr.length, cleanTargetStr.length);
          
          for(let i=0; i<minLen; i++){
            if(cleanTransStr[i] === cleanTargetStr[i]) matchCount++;
          }
          const matchRate = maxLen > 0 ? (matchCount / maxLen) : 0;
          
          if (matchRate >= 0.8 || trans === targetSentence.toLowerCase().replace(/[.]/g, '')) {
            setSlideVoiceFeedback("Excellent! 👏");
            setSlideVoiceFailCount(0);
            setTimeout(() => {
              setSlideVoiceCleared(true);
            }, 1000);

            setSlideVoiceFailCount(c => c + 1);

        };

            setSlideVoiceFailCount(c => c + 1);
            setSlideVoiceFeedback("エラーがおきました。もう一度ボタンをおしてね。"); 
            setIsSlideListening(false); 
        };
        recognition.onend = () => setIsSlideListening(false);
        recognition.start();

            setTimeout(() => {
              saveProgress(totalCoins, newItems, nextLevel, 0, newHelpers, newDishes);

              setTimeout(() => setFeedEffect(null), 3000);

          } else {
            saveProgress(totalCoins, newItems, kummaniLevel, newExp, helpers, newDishes);
            setFeedEffect(null);
          }

      };

      const BackButton = () => (

      const renderNoteLines = (ansData, isTeacherScreen = false) => {

                  <div className={`${isTeacherScreen ? 'bg-gray-100 p-4 rounded-xl border border-gray-200' : 'four-lines-bg rounded-b-lg border-2 border-gray-200 shadow-sm'} flex min-w-max`}>

                      {isTeacherScreen ? (

                      ) : (
                        <span className="text-teal-700">{ans.en}</span>
                      )}
                      <span className="text-gray-800 shrink-0 pr-4">{ans.suffix}</span>
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        );
      };

      let content = null;

      const nextExpRequired = currentStage.next.length > 0 ? KUMMANI_STAGES[currentStage.next[0]].reqExp : currentStage.reqExp + 3;
      
      if (step === 'HOME') {
        content = (
          <div className="min-h-screen p-4 md:p-8 flex flex-col justify-center relative bg-teal-50 pb-20">
            <div className="bg-red-100 text-red-800 font-bold p-3 rounded-xl mb-4 text-center border-2 border-red-200 text-sm md:text-base">
              ⚠️ ブラウザの履歴を消すとデータが消えます。次の授業まで履歴を消さないように気をつけてね！
            </div>

            {feedEffect && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative">
                  {feedEffect.phase === 'buy_salmon' && (
                    <div className="animate-bounce-in">
                      <div className="text-8xl mb-4">🐟</div>
                      <p className="text-3xl font-bold text-teal-600">シャケを {feedEffect.amount ? `${feedEffect.amount}個 ` : ''}ゲットした！</p>
                    </div>
                  )}
                  {feedEffect.phase === 'cooking' && <div className="animate-pulse"><div className="text-8xl mb-4">🍳</div><p className="text-2xl font-bold text-orange-600">おりょうり中...</p></div>}
                  {feedEffect.phase === 'done' && (
                    <div className="animate-fade-in-up">
                      <div className="text-8xl mb-4">✨🍽️✨</div>
                      <p className="text-xl font-bold text-orange-700 mb-1">{feedEffect.dish.name}</p>
                      <p className="text-sm font-bold text-gray-500 mb-6">{feedEffect.dish.ruby}</p>
                      <div className="text-7xl animate-bounce mb-6">{currentStage.emoji}</div>
                      <button onClick={handleDeliciousClick} className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-full text-xl shadow-md transition transform hover:scale-105">おいしそう！😋</button>
                    </div>
                  )}
                  {feedEffect.phase === 'evolving' && <div><p className="text-2xl font-bold text-gray-800 mb-8">{feedEffect.message || "おや…？"}</p><div className="text-9xl animate-pulse">{feedEffect.from.emoji}</div></div>}
                  {feedEffect.phase === 'evolved' && <div className="animate-bounce-in"><p className="text-3xl font-extrabold text-yellow-500 mb-8">{feedEffect.message || "おめでとう！"}</p><div className="text-9xl mb-8">{feedEffect.to.emoji}</div><p className="text-2xl font-bold text-gray-800"><span className="text-teal-600 text-3xl">{feedEffect.to.name}</span> に なった！</p></div>}
                </div>
              </div>

            <div className="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-xl border-4 border-teal-200 overflow-hidden">
              <div className="bg-gradient-to-r from-teal-400 to-emerald-500 p-8 text-center text-white">
                <h1 className="text-3xl md:text-4xl font-extrabold drop-shadow-md">My Best Memory!<br/><span className="text-xl md:text-2xl opacity-90 mt-2 block">一番の思い出を えいごで言おう</span></h1>

                {savedWorks.length > 0 && (

                            <button onClick={() => { setViewingWork(work); goToStep('VIEW_SLIDESHOW'); setCurrentSlideIndex(0); resetSlideVoice(); }} className="text-sm bg-teal-100 hover:bg-teal-200 text-teal-800 font-bold py-2 px-4 rounded shadow-sm border border-teal-300">スライド</button>
                          </div>

                <button onClick={() => {

                  const isDone = idx < currentSpeakLine;
                  return (
                    <div key={idx} className={`p-4 rounded-xl border-2 text-left flex justify-between items-center transition-all ${isActive ? 'bg-green-100 border-green-400 transform scale-105 shadow-md' : isDone ? 'bg-gray-100 border-gray-200 opacity-50' : 'bg-white border-gray-200 opacity-40'}`}>
                      <span>
                        <span className="block text-sm text-green-600 font-bold mb-1">{line.jp}</span>
                        <span className={`text-xl md:text-2xl font-bold font-note ${isDone ? 'line-through text-gray-500' : 'text-gray-800'}`}>{idx+1}. {line.text}</span>
                      </span>
                      {isActive && <button onClick={() => speak(line.text)} className="bg-white p-3 rounded-full text-green-600 shadow border border-green-200">🔊</button>}
                      {isDone && <span className="text-green-500 text-3xl">✓</span>}
                    </div>
                  );
                })}
              </div>

              {!isAllDone ? (
                <div>
                  <button onClick={() => {
                     startListening(speakLines[currentSpeakLine].text);
                  }} disabled={isListening} className={`w-24 h-24 rounded-full shadow-lg text-4xl mb-4 ${isListening ? 'bg-red-500 animate-pulse' : 'bg-teal-500 hover:bg-teal-600'} text-white transition`}>🎤</button>
                  <p className="font-bold text-gray-600">{isListening ? "はなしてね..." : "マイクをおして はなす"}</p>
                  {feedbackMsg && <div className="mt-4 p-4 rounded-xl font-bold text-lg border-2 bg-white whitespace-pre-line">{feedbackMsg}</div>}
                  
                  {failCount >= 3 && (
                    <div className="mt-6 animate-fade-in-up w-full flex flex-col items-center">
                        <p className="text-sm text-gray-500 mb-2 font-bold">むずかしい場合はスキップできます。</p>
                        <button onClick={() => { setCurrentSpeakLine(c => c+1); setFailCount(0); setFeedbackMsg(""); }} className="text-sm bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-full font-bold transition text-gray-700 shadow-sm border border-gray-300">⏭️ スキップして次へ</button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="animate-bounce-in">
                  <p className="text-2xl font-bold text-orange-500 mb-6">ぜんぶ 言えたね！🎉</p>
                  <button onClick={() => goToStep('GAME_INTRO')} className="w-full bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-6 rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center justify-center gap-2"><span>🎮</span> つぎは ミニゲーム！ ▶️</button>
                </div>
              )}
            </div>
          </div>
        );
      } 
      else if (step === 'GAME_INTRO') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <HomeButton />
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-green-200 mt-12">
              <h2 className="text-3xl font-bold text-green-600 mb-6">コインあつめ ゲーム！</h2>
              <div className="bg-green-100 p-6 rounded-2xl mb-8">
                <div className="text-6xl mb-4 flex justify-center items-center gap-2">
                  <span>🪙</span>
                  <span className="animate-bounce">{currentStage.emoji}</span>
                </div>
                <p className="text-lg font-bold text-gray-700 leading-relaxed text-left bg-white p-4 rounded-xl shadow-sm">
                  えいごの 練習 おつかれさま！<br/>ゲームだよ。<br/>
                  <br/>
                  やじるしキー や ボタンを おして<br/>
                  <span className="text-teal-600">{currentStage.name}</span> を うごかそう！<br/>
                  <br/>
                  <span className="text-red-500 text-xl font-black">15秒</span>の間に コインを あつめてね！<br/>
                  エイリアン（👾）に ぶつかると しばらく うごけなくなるよ！<br/>
                  <br/>
                  {helpers.length > 0 && <span className="text-purple-600 text-sm font-bold">集まった お助けキャラ が エイリアンを やっつけてくれるよ！</span>}
                </p>
              </div>
              <button onClick={() => goToStep('GAME')} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md w-full transition transform hover:scale-105">スタート！</button>
            </div>
          </div>
        );
      } 
      else if (step === 'GAME') {
         content = (
           <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 relative">
              <HomeButton />
              <CoinGame playerEmoji={currentStage.emoji} helpers={helpers} onFinish={(coins) => {
                handleGameFinish(coins);
              }} />
           </div>
         );
      } else if (step === 'VIEW_WORKSHEET' && viewingWork) {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-12 relative">
            <BackButton />
            <HomeButton />
            <div className="w-full max-w-3xl bg-white p-4 md:p-8 rounded-3xl shadow-xl border-4 border-yellow-300 relative">
              <h2 className="text-2xl font-bold text-gray-700 mb-6">📑 {viewingWork.date} のノート</h2>
              <div className="bg-white border-2 border-gray-300 p-2 md:p-8 rounded-xl shadow-inner mb-4 overflow-hidden">
                {renderNoteLines(viewingWork.answers, false)}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative touch-manipulation">
          {content}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
